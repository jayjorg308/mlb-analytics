name: Deploy to AWS ECS

on:
    push:
        branches:
            - main
    workflow_dispatch: # Allows manual triggering from the Actions tab

env:
    AWS_REGION: us-west-2
    ECR_REPOSITORY: mlbanalytics
    ECS_SERVICE: mlbanalytics
    ECS_CLUSTER: default

# Required for OIDC authentication
permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build, tag, and push image to ECR
              id: build-image
              env:
                  ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                  IMAGE_TAG: ${{ github.sha }}
              run: |
                  # Build with both a SHA tag (for traceability) and latest (for the ECS task)
                  docker build --platform linux/amd64 \
                    -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                    -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                    .

                  # Push both tags
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
                  docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

                  echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

            - name: Force ECS service redeployment
              run: |
                  aws ecs update-service \
                    --cluster ${{ env.ECS_CLUSTER }} \
                    --service ${{ env.ECS_SERVICE }} \
                    --force-new-deployment \
                    --region ${{ env.AWS_REGION }}

            - name: Wait for service to stabilize
              run: |
                  aws ecs wait services-stable \
                    --cluster ${{ env.ECS_CLUSTER }} \
                    --services ${{ env.ECS_SERVICE }} \
                    --region ${{ env.AWS_REGION }}

            - name: Deployment summary
              run: |
                  echo "### Deployment complete :rocket:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "- **Image tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **Service:** \`${{ env.ECS_SERVICE }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **Cluster:** \`${{ env.ECS_CLUSTER }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- **Region:** \`${{ env.AWS_REGION }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Live at [jaysonjorgensen.dev](https://jaysonjorgensen.dev)" >> $GITHUB_STEP_SUMMARY
